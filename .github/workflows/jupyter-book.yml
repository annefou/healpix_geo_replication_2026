name: Build and Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.pages_enabled }}
    steps:
      - uses: actions/checkout@v5

      - name: Check whether GitHub Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::notice::GitHub Pages is enabled — the book will deploy."
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled on this repo. The book will build but not deploy. Enable it at https://github.com/${{ github.repository }}/settings/pages (Source: GitHub Actions)."
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin mystmd to 1.9.1 — 1.10.x regressed on fetching the default
          # favicon from mystmd.org during `myst build` (ERR_STREAM_PREMATURE_CLOSE).
          pip install jupytext jupyterlab ipykernel nbclient "mystmd==1.9.1"

      - name: Convert .py notebooks to .ipynb
        run: |
          shopt -s nullglob
          for nb in notebooks/*.py; do
            jupytext --to notebook "$nb"
          done

      - name: Execute notebooks
        run: |
          shopt -s nullglob
          for nb in notebooks/*.ipynb; do
            echo "::group::Executing $nb"
            jupyter execute --inplace "$nb"
            echo "::endgroup::"
          done

      - name: Build MyST site
        env:
          # MyST ignores `base_url` in myst.yml on GitHub Pages — only this env var
          # works (the repo is served from /<repo-name>/).
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - name: Upload pages artifact
        if: steps.pages_check.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
